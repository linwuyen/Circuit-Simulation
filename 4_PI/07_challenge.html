<body class="p-4 md:p-6">
<div class="max-w-6xl mx-auto">

    <div class="mb-5">
        <p class="text-sm font-semibold text-amber-600">關卡 07 · 驗收</p>
        <h1 class="text-2xl md:text-3xl font-bold text-gray-800 mb-2">🏆 挑戰任務：把學到的東西調出來</h1>
        <p class="text-gray-600">不再只是看圖。給你<b>目標規格</b>,你來拖 Kp、Ki 把它達成。每條規格即時判定 ✅/⬜,全部亮燈就通關。從第①關開始,越後面越難。</p>
        <p id="progress" class="text-sm font-semibold text-amber-700 mt-1">已通關 0 / 4</p>
    </div>

    <!-- 任務選擇 -->
    <div id="mission-btns" class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-5"></div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
        <div class="space-y-4">
            <!-- 任務卡 -->
            <div class="card border-2" id="mission-card">
                <h3 id="m-title" class="font-bold text-gray-800 text-base mb-1">--</h3>
                <p id="m-desc" class="text-xs text-gray-500 mb-3">--</p>
                <ul id="checklist" class="text-sm space-y-1"></ul>
            </div>

            <!-- 通關橫幅 -->
            <div id="win-banner" class="hidden bg-green-50 border-2 border-green-300 rounded-lg p-4 text-center">
                <div class="text-2xl mb-1">🎉</div>
                <p class="font-bold text-green-800">通關！這組 Kp / Ki 達成所有規格。</p>
                <p id="win-detail" class="text-xs text-green-700 mt-1"></p>
            </div>

            <!-- 控制 -->
            <div class="card">
                <label class="block text-sm font-bold text-gray-700 mb-1">Kp：<span id="kp-val" class="text-blue-600">0.10</span></label>
                <input type="range" id="kp-slider" min="0.01" max="2.0" step="0.01" value="0.10">
                <label class="block text-sm font-bold text-gray-700 mb-1 mt-3">Ki：<span id="ki-val" class="text-blue-600">1000</span></label>
                <input type="range" id="ki-slider" min="100" max="50000" step="100" value="1000">
                <button id="hint-btn" class="text-xs text-amber-700 underline mt-3">需要提示？</button>
                <p id="hint-text" class="hidden text-xs text-gray-500 mt-1 bg-amber-50 p-2 rounded"></p>
            </div>

            <!-- 即時數據 -->
            <div class="card text-sm">
                <h3 class="font-bold text-gray-800 border-b pb-2 mb-2 text-sm">即時量測</h3>
                <div class="grid grid-cols-2 gap-y-1 text-xs">
                    <span class="text-gray-500">頻寬 fc</span><span id="r-fc" class="text-right font-mono">--</span>
                    <span class="text-gray-500">相位裕度 PM</span><span id="r-pm" class="text-right font-mono">--</span>
                    <span class="text-gray-500">增益裕度 GM</span><span id="r-gm" class="text-right font-mono">--</span>
                    <span class="text-gray-500">60Hz 增益</span><span id="r-lf" class="text-right font-mono">--</span>
                    <span class="text-gray-500">時域過衝</span><span id="r-os" class="text-right font-mono">--</span>
                </div>
            </div>
        </div>

        <div class="lg:col-span-2 space-y-4">
            <div class="bg-white rounded-lg shadow-sm px-4 py-2 text-xs flex flex-wrap gap-x-4 gap-y-1">
                <span><span class="legend-dot" style="background:#2563eb"></span>L(s)</span>
                <span><span class="legend-dot" style="background:#16a34a"></span>交越 fc</span>
                <span><span class="legend-dot" style="background:#a855f7"></span>諧振 fn</span>
                <span class="text-gray-400">紅虛線：0dB</span>
            </div>
            <div class="chart-container"><canvas id="gainChart"></canvas></div>
            <div class="chart-container"><canvas id="stepChart"></canvas></div>
        </div>
    </div>

    <div class="flex justify-between items-center mt-6 text-sm">
        <a href="pi.html" class="px-4 py-2 rounded-lg bg-white shadow-sm text-gray-600 hover:bg-gray-50">← 設計沙盒</a>
        <a href="index.html" class="px-4 py-2 rounded-lg bg-amber-600 text-white shadow-sm hover:bg-amber-700 font-semibold">回課程地圖 🏁</a>
    </div>
</div>

<script>
const Wn = 10000, WnSq = Wn*Wn, Zeta = 0.2, TwoZetaWn = 2*Zeta*Wn;
const F_RES = Wn/(2*Math.PI);
const F_MIN = 10, F_MAX = 100000, N = 300;
const freqs = [];
for (let i = 0; i < N; i++) freqs.push(F_MIN * Math.pow(F_MAX / F_MIN, i / (N - 1)));

let gainChart, stepChart, current = 0;
function fmtHz(f){ return f >= 1000 ? (f/1000).toFixed(2)+' kHz' : f.toFixed(0)+' Hz'; }
function cMul(ar,ai,br,bi){ return {re:ar*br-ai*bi, im:ar*bi+ai*br}; }
function unwrap(raw){ let off=0; const o=[]; for(let i=0;i<raw.length;i++){ if(i>0){const d=raw[i]-raw[i-1]; if(d>180)off-=360; else if(d<-180)off+=360;} o.push(raw[i]+off);} return o; }

function bodePoint(f, kp, ki){
    const w = 2*Math.PI*f;
    const C = { re: kp, im: -ki/w };
    const dre = WnSq - w*w, dim = w*TwoZetaWn, den = dre*dre+dim*dim;
    const P = { re: WnSq*dre/den, im: -WnSq*dim/den };
    const L = cMul(C.re,C.im,P.re,P.im);
    return { Lg: 20*Math.log10(Math.hypot(L.re,L.im)), Lp: Math.atan2(L.im,L.re)*180/Math.PI };
}
function calculateBode(kp, ki){
    const Lg=[], LpR=[];
    for (const f of freqs){ const p=bodePoint(f,kp,ki); Lg.push(p.Lg); LpR.push(p.Lp); }
    const Lp = unwrap(LpR);
    let fc=0,pm=0,pcAtFc=null,hasCross=false;
    for (let i=1;i<freqs.length;i++){ if (Lg[i-1]>0 && Lg[i]<=0){
        const r=Lg[i-1]/(Lg[i-1]-Lg[i]); const lf=Math.log10(freqs[i-1])+r*(Math.log10(freqs[i])-Math.log10(freqs[i-1]));
        fc=Math.pow(10,lf); pcAtFc=Lp[i-1]+r*(Lp[i]-Lp[i-1]); pm=180+pcAtFc; hasCross=true; break; } }
    let gm=Infinity,gmFinite=false;
    for (let i=1;i<freqs.length;i++){ if (Lp[i-1]>-180 && Lp[i]<=-180){
        const r=(Lp[i-1]+180)/(Lp[i-1]-Lp[i]); const gAt=Lg[i-1]+r*(Lg[i]-Lg[i-1]); gm=-gAt; gmFinite=true; break; } }
    return { Lg:Lg.map((y,i)=>({x:freqs[i],y})), m:{hasCross,fc,pm,pcAtFc,gm,gmFinite} };
}
function simulateStep(kp, ki){
    const a2=TwoZetaWn, a1=WnSq*(1+kp), a0=ki*WnSq, b1=kp*WnSq, b0=ki*WnSq;
    const dt=2e-6, tEnd=6e-3, steps=Math.round(tEnd/dt);
    let x1=0,x2=0,x3=0,peak=0,diverged=false; const data=[];
    const dv=(a,b,c)=>[b,c,-a0*a-a1*b-a2*c+1];
    for (let i=0;i<=steps;i++){ const y=b0*x1+b1*x2; if(i%5===0)data.push({x:i*dt*1000,y});
        if(y>peak)peak=y; if(!isFinite(y)||Math.abs(y)>50){diverged=true;break;}
        const k1=dv(x1,x2,x3),k2=dv(x1+0.5*dt*k1[0],x2+0.5*dt*k1[1],x3+0.5*dt*k1[2]),
              k3=dv(x1+0.5*dt*k2[0],x2+0.5*dt*k2[1],x3+0.5*dt*k2[2]),k4=dv(x1+dt*k3[0],x2+dt*k3[1],x3+dt*k3[2]);
        x1+=dt/6*(k1[0]+2*k2[0]+2*k3[0]+k4[0]); x2+=dt/6*(k1[1]+2*k2[1]+2*k3[1]+k4[1]); x3+=dt/6*(k1[2]+2*k2[2]+2*k3[2]+k4[2]); }
    return { data, diverged, overshoot: Math.max(0,(peak-1)*100) };
}

// ===== 任務定義 =====
// 註：此受控體諧振在 1.59kHz、阻尼低(ζ=0.2,峰 +8dB)，安全頻寬上限約 0.86kHz、
//     60Hz 增益上限約 19dB。以下門檻皆已用數值掃描確認「在滑桿範圍內有解」。
const missions = [
  { id:'m1', name:'① 先穩住', color:'#16a34a',
    desc:'最基本功：讓頻寬 fc 至少 300Hz,而且系統穩定(不發散)。',
    hint:'試 Kp≈0.1、Ki≈2000 讓藍線穿過 0dB、頻寬到 300Hz 以上。只要不發散就過關。',
    checks:[
      { label:'頻寬 fc ≥ 300 Hz', val:m=> m.hasCross?fmtHz(m.fc):'未交越', test:m=> m.hasCross && m.fc>=300 },
      { label:'系統穩定（不發散、PM>0）', val:m=> m.diverged?'發散':(m.hasCross?m.pm.toFixed(0)+'°':'--'), test:m=> m.stable }
    ]},
  { id:'m2', name:'② 留裕度', color:'#2563eb',
    desc:'頻寬 fc ≥ 400Hz,同時保有安全餘量：相位裕度 PM ≥ 45°、增益裕度 GM > 6dB。',
    hint:'試 Kp≈0.2、Ki≈2400。GM 卡在 6dB 邊緣時把 Ki 降一點,諧振峰會離 0dB 更遠。',
    checks:[
      { label:'頻寬 fc ≥ 400 Hz', val:m=> m.hasCross?fmtHz(m.fc):'未交越', test:m=> m.hasCross && m.fc>=400 },
      { label:'相位裕度 PM ≥ 45°', val:m=> m.hasCross?m.pm.toFixed(0)+'°':'--', test:m=> m.hasCross && m.pm>=45 },
      { label:'增益裕度 GM > 6 dB', val:m=> m.gmFinite?m.gm.toFixed(1)+' dB':'∞', test:m=> !m.gmFinite || m.gm>6 }
    ]},
  { id:'m3', name:'③ 顧精準', color:'#7c3aed',
    desc:'低頻追隨：60Hz 增益 ≥ 15dB(此受控體實際上限約 19dB),且維持 PM ≥ 45°、GM > 6dB、過衝 < 25%。',
    hint:'60Hz 增益主要由 Ki 決定(≈Ki/377 倍)。試 Kp≈0.1、Ki≈2300 拿到 15dB,Kp 放小以守住 GM 與低過衝。',
    checks:[
      { label:'60Hz 增益 ≥ 15 dB', val:m=> m.lowFreqGain.toFixed(1)+' dB', test:m=> m.lowFreqGain>=15 },
      { label:'相位裕度 PM ≥ 45°', val:m=> m.hasCross?m.pm.toFixed(0)+'°':'--', test:m=> m.hasCross && m.pm>=45 },
      { label:'增益裕度 GM > 6 dB', val:m=> m.gmFinite?m.gm.toFixed(1)+' dB':'∞', test:m=> !m.gmFinite || m.gm>6 },
      { label:'時域過衝 < 25%', val:m=> m.diverged?'發散':m.overshoot.toFixed(0)+'%', test:m=> !m.diverged && m.overshoot<25 }
    ]},
  { id:'m4', name:'④ 逼極限', color:'#d97706',
    desc:'高手關：把頻寬推到 fc ≥ 700Hz(很接近安全上限),同時仍守住 PM ≥ 45°、GM > 6dB。窗口很窄!',
    hint:'甜蜜點在 Kp≈0.40、Ki≈3200。Kp 別超過約 0.43,否則交越點會跳到諧振之上、PM 直接崩掉。fc 不足就略增 Ki。',
    checks:[
      { label:'頻寬 fc ≥ 700 Hz', val:m=> m.hasCross?fmtHz(m.fc):'未交越', test:m=> m.hasCross && m.fc>=700 },
      { label:'相位裕度 PM ≥ 45°', val:m=> m.hasCross?m.pm.toFixed(0)+'°':'--', test:m=> m.hasCross && m.pm>=45 },
      { label:'增益裕度 GM > 6 dB', val:m=> m.gmFinite?m.gm.toFixed(1)+' dB':'∞', test:m=> !m.gmFinite || m.gm>6 }
    ]}
];

function getCleared(){ try { return JSON.parse(localStorage.getItem('pi_challenge')||'[]'); } catch(e){ return []; } }
function setCleared(arr){ try { localStorage.setItem('pi_challenge', JSON.stringify(arr)); } catch(e){} }

function renderMissionBtns(){
    const cleared = getCleared();
    const wrap = document.getElementById('mission-btns');
    wrap.innerHTML = '';
    missions.forEach((mi, i) => {
        const b = document.createElement('button');
        b.className = 'mbtn' + (i===current ? ' active' : '');
        b.innerHTML = (cleared.includes(mi.id) ? '🏆 ' : '') + mi.name;
        b.addEventListener('click', () => { current = i; renderMissionBtns(); loadMission(); });
        wrap.appendChild(b);
    });
    document.getElementById('progress').textContent = `已通關 ${cleared.filter(c=>missions.some(m=>m.id===c)).length} / ${missions.length}`;
}

function loadMission(){
    const mi = missions[current];
    document.getElementById('m-title').textContent = mi.name + '　' ;
    document.getElementById('m-desc').textContent = mi.desc;
    document.getElementById('mission-card').style.borderColor = mi.color;
    document.getElementById('hint-text').textContent = mi.hint;
    document.getElementById('hint-text').classList.add('hidden');
    update();
}

function update(){
    const kp = parseFloat(document.getElementById('kp-slider').value);
    const ki = parseFloat(document.getElementById('ki-slider').value);
    document.getElementById('kp-val').textContent = kp.toFixed(2);
    document.getElementById('ki-val').textContent = ki;

    const b = calculateBode(kp, ki);
    const step = simulateStep(kp, ki);
    const lowFreqGain = bodePoint(60, kp, ki).Lg;
    const metrics = {
        hasCross: b.m.hasCross, fc: b.m.fc,
        pm: b.m.hasCross ? b.m.pm : -999,
        gm: b.m.gm, gmFinite: b.m.gmFinite,
        lowFreqGain, overshoot: step.overshoot, diverged: step.diverged,
        stable: !step.diverged && b.m.hasCross && b.m.pm > 0
    };

    // 即時量測
    document.getElementById('r-fc').textContent = metrics.hasCross ? fmtHz(metrics.fc) : '未交越';
    document.getElementById('r-pm').textContent = metrics.hasCross ? metrics.pm.toFixed(0)+'°' : '--';
    document.getElementById('r-gm').textContent = metrics.gmFinite ? metrics.gm.toFixed(1)+' dB' : '∞';
    document.getElementById('r-lf').textContent = metrics.lowFreqGain.toFixed(1)+' dB';
    document.getElementById('r-os').textContent = metrics.diverged ? '發散 💥' : metrics.overshoot.toFixed(0)+'%';

    // checklist
    const mi = missions[current];
    let allPass = true;
    const ul = document.getElementById('checklist');
    ul.innerHTML = '';
    mi.checks.forEach(c => {
        const ok = c.test(metrics);
        if (!ok) allPass = false;
        const li = document.createElement('li');
        li.className = 'flex justify-between items-center py-1 border-b border-gray-50';
        li.innerHTML = `<span class="${ok?'text-green-700':'text-gray-600'}">${ok?'✅':'⬜'} ${c.label}</span>`+
                       `<span class="font-mono text-xs ${ok?'text-green-600 font-bold':'text-gray-400'}">${c.val(metrics)}</span>`;
        ul.appendChild(li);
    });

    // 通關
    const banner = document.getElementById('win-banner');
    if (allPass){
        banner.classList.remove('hidden');
        document.getElementById('win-detail').textContent = `Kp=${kp.toFixed(2)}, Ki=${ki}　→　fc=${fmtHz(metrics.fc)}, PM=${metrics.pm.toFixed(0)}°`;
        const cleared = getCleared();
        if (!cleared.includes(mi.id)){ cleared.push(mi.id); setCleared(cleared); renderMissionBtns(); }
    } else {
        banner.classList.add('hidden');
    }

    // 圖
    const gset=[ { data:b.Lg, borderColor:'#2563eb', borderWidth:2.5, fill:false },
        { data:[{x:F_MIN,y:0},{x:F_MAX,y:0}], borderColor:'rgba(239,68,68,0.5)', borderWidth:1.5, borderDash:[6,4], pointRadius:0, fill:false },
        { data:[{x:F_RES,y:-80},{x:F_RES,y:80}], borderColor:'rgba(168,85,247,0.4)', borderWidth:1.5, borderDash:[3,3], pointRadius:0, fill:false } ];
    if (metrics.hasCross){ gset.push({ data:[{x:metrics.fc,y:-80},{x:metrics.fc,y:80}], borderColor:'rgba(22,163,74,0.7)', borderWidth:1.5, pointRadius:0, fill:false });
        gset.push({ data:[{x:metrics.fc,y:0}], borderColor:'#16a34a', backgroundColor:'#16a34a', pointRadius:6, showLine:false }); }
    gainChart.data.datasets = gset; gainChart.update();
    stepChart.data.datasets[0].data = step.data; stepChart.update();
}

function init(){
    const common = {
        responsive: true, maintainAspectRatio: false, parsing: false, animation: { duration: 90 },
        elements: { point: { radius: 0 }, line: { tension: 0 } },
        plugins: { legend: { display: false }, tooltip: { enabled: false } },
        scales: { x: { type: 'logarithmic', min: F_MIN, max: F_MAX, title: { display: true, text: '頻率 (Hz, log)' }, grid: { color: 'rgba(0,0,0,.05)' } } }
    };
    gainChart = new Chart(document.getElementById('gainChart').getContext('2d'), { type:'line', data:{datasets:[]},
        options:{ ...common, plugins:{ ...common.plugins, title:{ display:true, text:'開迴路增益（綠點=fc，紫線=諧振）', align:'start' } },
            scales:{ ...common.scales, y:{ min:-80, max:80, title:{ display:true, text:'Magnitude (dB)' }, grid:{ color:'rgba(0,0,0,.05)' } } } } });
    stepChart = new Chart(document.getElementById('stepChart').getContext('2d'), { type:'line',
        data:{ datasets:[
            { data:[], borderColor:'#ea580c', borderWidth:2.5, pointRadius:0, fill:false },
            { data:[{x:0,y:1},{x:6,y:1}], borderColor:'rgba(100,116,139,0.7)', borderWidth:1.5, borderDash:[6,4], pointRadius:0, fill:false }
        ]},
        options:{ responsive:true, maintainAspectRatio:false, parsing:false, animation:{duration:90},
            elements:{ point:{radius:0}, line:{tension:0} },
            plugins:{ legend:{display:false}, tooltip:{enabled:false}, title:{ display:true, text:'時域階躍響應：輸出(橘)追指令(灰)', align:'start' } },
            scales:{ x:{ type:'linear', min:0, max:6, title:{ display:true, text:'時間 (ms)' }, grid:{color:'rgba(0,0,0,.05)'} },
                     y:{ min:-0.2, max:2.2, title:{ display:true, text:'輸出 (目標=1)' }, grid:{color:'rgba(0,0,0,.05)'} } } } });
}

document.getElementById('hint-btn').addEventListener('click', () => document.getElementById('hint-text').classList.toggle('hidden'));
['kp-slider','ki-slider'].forEach(id => document.getElementById(id).addEventListener('input', update));
init();
renderMissionBtns();
loadMission();
</script>
</body>
