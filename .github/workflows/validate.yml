name: Validate learning pack

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node tools/validate-project.mjs
      - run: node tools/audit-dynamic-visuals.mjs
      - run: npm test

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build and run C2000 Buck host SIL
        run: |
          gcc -std=c11 -Wall -Wextra -Werror \
            19_c2000_buck_firmware_lab/firmware/buck_control.c \
            19_c2000_buck_firmware_lab/firmware/host_sil.c \
            -I19_c2000_buck_firmware_lab/firmware -lm -o /tmp/c2000-buck-sil
          /tmp/c2000-buck-sil

      - name: Check out pinned C2000Ware target support
        uses: actions/checkout@v4
        with:
          repository: TexasInstruments/c2000ware-core-sdk
          ref: REL_C2000Ware_v26.01.00.00.STS
          path: .ci/c2000ware
          sparse-checkout: |
            device_support/f2838x/common/include
            device_support/f2838x/common/source
            device_support/f2838x/common/cmd
            driverlib/f2838x/driverlib
          sparse-checkout-cone-mode: true

      - name: Install TI C2000 CGT 25.11.1.LTS
        run: bash tools/ci/install-ti-c2000-cgt.sh

      - name: Compile F2838x CPU1 target with TI cl2000
        env:
          C2000WARE_ROOT: ${{ github.workspace }}/.ci/c2000ware
        run: bash tools/ci/build-f2838x-target.sh

      - name: Link F2838x flash image and generate Intel HEX
        env:
          C2000WARE_ROOT: ${{ github.workspace }}/.ci/c2000ware
        run: bash tools/ci/build-f2838x-image.sh

      - name: Upload F2838x flash image
        uses: actions/upload-artifact@v4
        with:
          name: c2000-buck-f2838x-flash-image
          path: |
            build/f2838x-flash/c2000-buck-f2838x.out
            build/f2838x-flash/c2000-buck-f2838x.map
            build/f2838x-flash/c2000-buck-f2838x.hex
          if-no-files-found: error


  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Upload Playwright failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-diagnostics
          path: |
            playwright-failures.jsonl
            test-results/
          if-no-files-found: ignore

  validate:
    if: always()
    needs: [validate-platform, browser, firmware]
    runs-on: ubuntu-latest
    steps:
      - name: Require all validation jobs to pass
        env:
          PLATFORM_RESULT: ${{ needs.validate-platform.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          FIRMWARE_RESULT: ${{ needs.firmware.result }}
        run: |
          test "$PLATFORM_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$FIRMWARE_RESULT" = success
