name: Verify published GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify selected published assets match checked-out files
        shell: bash
        run: |
          set -euo pipefail
          site='https://linwuyen.github.io/Circuit-Simulation'
          files=(
            index.html
            assets/learning/workspace-ui.js
            assets/learning/workspace.css
            assets/engineering-sandbox-core.js
          )
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          for attempt in {1..12}; do
            failed=0
            for file in "${files[@]}"; do
              mkdir -p "$tmp/$(dirname "$file")"
              if ! curl --fail --silent --show-error --location --max-time 20 --output "$tmp/$file" "$site/$file"; then
                echo "attempt $attempt: missing or unavailable: $file"
                failed=1
                break
              fi
              if ! cmp -s "$file" "$tmp/$file"; then
                echo "attempt $attempt: published content differs: $file"
                failed=1
                break
              fi
            done
            if [[ "$failed" -eq 0 ]]; then
              echo "PASS: sampled published assets match checkout at $GITHUB_SHA"
              echo "Pages selected-asset bytes PASS against checkout $GITHUB_SHA (not full deployment attestation)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ "$attempt" -lt 12 ]]; then sleep 20; fi
          done
          echo "FAIL: Pages unavailable or sampled published files differ from checkout $GITHUB_SHA" >&2
          echo "Pages selected-asset bytes FAIL against checkout $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          exit 1
