<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>讓輸出靠近目標｜電子模擬一步一步學</title><link rel="stylesheet" href="assets/beginner-lab.css"><link rel="stylesheet" href="assets/learning/plain-course.css"></head><body data-simple-course><header><a href="index.html">電子模擬・我的下一步</a><span>從看懂電路，到讓它自己調整</span></header><main>
<details class="simple-extras"><summary>選課／重看</summary><nav id="bridge-nav" aria-label="選擇短課"></nav></details>
<section class="lesson"><p id="lesson-count"></p><h1 id="lesson-title" tabindex="-1"></h1><p id="lesson-intro"></p><nav class="simple-steps" id="simple-steps" aria-label="本課步驟"></nav>
<section data-stage="0"><h2>1. 先猜</h2><p id="question"></p><fieldset id="prediction"><legend>你的判斷</legend><div id="prediction-options"></div></fieldset><button id="predict" type="button">記下我的判斷</button><p id="prediction-status" role="status"></p></section>
<section data-stage="1" hidden><h2>2. 觀察前後變化</h2><p id="target"></p><label id="control-label" for="experiment-control"></label><div class="control"><input id="experiment-control" type="range"><output id="control-value"></output></div><p>先用簡化例子看調整方向：每輪量一次，再補上指定比例的差距。這不是實際電路波形。</p><svg id="bridge-plot" class="bridge-plot" viewBox="0 0 720 280" role="img" aria-label="調整前後比較，橫軸調整輪次，縱軸電壓 V"></svg><p id="before-after" class="simple-comparison"></p><div id="observation-proof" class="simple-proof"></div></section>
<section data-stage="2" hidden><h2>3. 說說原因</h2><div id="reason-proof" class="simple-proof"></div></section>
<section data-stage="3" hidden><h2>4. 換個條件，再試一次</h2><p id="transfer-question"></p><label for="transfer-value">下一個數字（V）</label><input id="transfer-value" type="number" step="any"><button id="transfer-submit" type="button">檢查新條件答案</button><p id="transfer-status" role="status"></p></section>
<aside id="lesson-help" hidden><details id="hint"><summary>給我一個提示</summary><p id="hint-text"></p></details><details id="explanation"><summary>看看完整解釋</summary><p id="explanation-text"></p></details></aside>
<section id="simple-result" hidden><h2>這課已完成練習</h2><p id="ability"></p><button id="next-lesson" type="button">下一課</button></section><p id="save-status" role="status"></p></section>
<details class="lesson simple-extras"><summary>這個簡化規則，什麼時候不能直接用？</summary><p>這三課只用「下次數字 = 這次數字 + 比例 × 剩餘差距」說明調整方向。實際電路還有電感、電容、取樣延遲、上下限等因素，所以不能拿本頁的比例直接當成真實控制器設定。</p><p>完成表示做過本頁的觀察、原因判斷與新條件練習；原本的正式測驗紀錄獨立保留。</p><a href="map.html">詳細紀錄與備份工具</a></details></main><script src="assets/learning/learning-evidence.js"></script><script src="assets/learning/plain-course-core.js"></script><script src="assets/learning/control-basics-ui.js"></script></body></html>
