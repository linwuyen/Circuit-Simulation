<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教學試用觀察表</title><link rel="stylesheet" href="assets/learning/plain-course.css"></head><body class="plain-learning"><main class="simple-home simple-observer"><a href="index.html">回到學習首頁</a><h1>找出真正讓人卡住的地方</h1><p>請讓學習者從首頁開始，獨立完成一課。觀察者先不提示，記下卡住的位置；之後再請學習者用自己的話解釋。這張表只記本次觀察，不能代替學習成效研究。</p><form id="review-form"><label>本次匿名代號（例如 A01，不填姓名）<input id="participant" required maxlength="40" pattern="[A-Za-z0-9_-]+"></label><label>學習經驗<select id="experience" required><option value="">尚未填寫</option><option value="new">第一次學電子電路</option><option value="some">學過一些基礎</option><option value="experienced">熟悉電路</option></select></label><label>觀察哪一課<select id="lesson" required><option value="">尚未填寫</option><option>開關時間</option><option>關閉後的電流</option><option>用電變少</option><option>儀器顯示</option><option>命令生效</option><option>目標差距</option><option>逐步調整</option><option>調過頭</option></select></label><button id="start" type="button">開始觀察</button> <button id="finish" type="button" disabled>結束觀察</button><p id="timer-status" role="status">尚未開始；計時不代表能力分數。</p><div id="review-checks"></div><label>卡在哪一步／哪個詞？（可留白，勿填個人資料）<textarea id="notes" rows="4" maxlength="2000"></textarea></label><button id="export" type="submit">下載這次觀察紀錄</button><p id="review-status" role="status"></p></form><p>資料只在目前頁面暫存，下載後由你保管；沒有自動傳送。未觀察的項目會記為「未觀察」，不算成功或失敗。</p></main><script src="assets/learning/teaching-review.js"></script></body></html>
