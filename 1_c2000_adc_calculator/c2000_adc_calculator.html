<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C2000 ADC 訊號鏈計算器</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#1e293b;--muted:#64748b;--line:#dbe3ee;--blue:#2563eb;--green:#047857;--amber:#a16207;--red:#b91c1c;--mono:ui-monospace,Consolas,monospace}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.55}.wrap{max-width:1220px;margin:auto;padding:22px 16px 56px}h1{margin:0 0 5px}.lead{margin:0 0 18px;color:var(--muted)}.notice{padding:12px 14px;border:1px solid #bfdbfe;border-radius:10px;background:#eff6ff;color:#1e3a8a;margin-bottom:16px}.layout{display:grid;grid-template-columns:330px 1fr;gap:16px}.stack{display:grid;gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}.card h2{margin:0 0 12px;font-size:18px}.field{display:grid;grid-template-columns:1fr 130px 46px;gap:8px;align-items:center;margin:9px 0}.field label{font-size:13px;color:#475569}.field input,.field select{width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:7px;background:#fff;text-align:right;font:14px var(--mono)}.unit{color:var(--muted);font-size:12px}.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.metric{padding:12px;border:1px solid var(--line);border-radius:10px;background:#f8fafc}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;margin-top:4px;font:800 18px var(--mono);overflow-wrap:anywhere}.metric small{display:block;margin-top:4px;color:var(--muted)}.section{margin-top:14px}.section h3{margin:0 0 8px;font-size:16px}.warns{display:grid;gap:8px;margin-top:12px}.alert{padding:10px 12px;border-radius:9px;font-weight:700}.bad{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}.warn{background:#fffbeb;border:1px solid #fde68a;color:#854d0e}.good{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46}.bar{position:relative;height:34px;border:1px solid #cbd5e1;border-radius:8px;background:#e2e8f0;overflow:hidden;margin-top:8px}.fill{height:100%;background:#93c5fd}.mark{position:absolute;top:0;bottom:0;width:3px;background:#1d4ed8}.zero{position:absolute;top:0;bottom:0;border-left:2px dashed #475569}.formula,pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#111827;color:#d1fae5;border-radius:10px;padding:13px;font:12px/1.6 var(--mono)}button{padding:8px 12px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;cursor:pointer;font-weight:700}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}@media(max-width:850px){.layout{grid-template-columns:1fr}.field{grid-template-columns:1fr 120px 42px}}@media(max-width:480px){.field{grid-template-columns:1fr 1fr}.field label{grid-column:1/-1}.unit{align-self:center}}
</style>
<link rel="stylesheet" href="../assets/learning/tutor.css" data-circuit-tutor-css>
</head>
<body>
<main class="wrap">
<h1>🧮 C2000 ADC 訊號鏈計算器</h1>
<p class="lead">驗證雙向電流量測、高壓分壓、ADC 量化、功耗與韌體 scaling。數值超出適用範圍時會明確警告。</p>
<div class="notice"><b>量化定義：</b>理想 N-bit ADC 有 2<sup>N</sup> 個 code，LSB = Vref / 2<sup>N</sup>。`2^N−1` 只用於最大 code 與端點顯示換算，不再混作 LSB 分母。</div>
<div class="layout">
<aside class="stack">
<section class="card"><h2>ADC 規格</h2>
<div class="field"><label for="vref">參考電壓</label><input id="vref" type="number" value="3.3" min="0.1" step="0.1"><span class="unit">V</span></div>
<div class="field"><label for="bits">解析度</label><select id="bits"><option>10</option><option selected>12</option><option>14</option><option>16</option></select><span class="unit">bit</span></div>
</section>
<section class="card"><h2>電流訊號鏈</h2>
<div class="field"><label for="current">目前電流</label><input id="current" type="number" value="20" step="0.5"><span class="unit">A</span></div>
<div class="field"><label for="shunt">Shunt</label><input id="shunt" type="number" value="0.005" min="0.000001" step="0.001"><span class="unit">Ω</span></div>
<div class="field"><label for="gain">放大倍率</label><input id="gain" type="number" value="8.2" min="0.01" step="0.1"><span class="unit">V/V</span></div>
<div class="field"><label for="offset">Offset</label><input id="offset" type="number" value="1.65" step="0.05"><span class="unit">V</span></div>
</section>
<section class="card"><h2>高壓分壓</h2>
<div class="field"><label for="bus">目前母線</label><input id="bus" type="number" value="400" min="0" step="10"><span class="unit">V</span></div>
<div class="field"><label for="rtop">Rtop 總值</label><input id="rtop" type="number" value="1000" min="0.001" step="10"><span class="unit">kΩ</span></div>
<div class="field"><label for="rbot">Rbot</label><input id="rbot" type="number" value="6.8" min="0.001" step="0.1"><span class="unit">kΩ</span></div>
<div class="field"><label for="seriesCount">Rtop 串聯顆數</label><input id="seriesCount" type="number" value="4" min="1" step="1"><span class="unit">顆</span></div>
</section>
</aside>
<section class="stack">
<section class="card"><h2>ADC 基本結果</h2><div class="results" id="adcResults"></div></section>
<section class="card"><h2>電流鏈結果</h2><div class="results" id="currentResults"></div><div class="bar"><div class="fill" id="currentFill"></div><div class="zero" id="currentZero"></div><div class="mark" id="currentMark"></div></div><div class="warns" id="currentWarns"></div></section>
<section class="card"><h2>分壓與功耗結果</h2><div class="results" id="dividerResults"></div><div class="bar"><div class="fill" id="voltageFill"></div><div class="mark" id="voltageMark"></div></div><div class="warns" id="dividerWarns"></div></section>
<section class="card"><h2>韌體 scaling</h2><pre id="code"></pre><div class="actions"><button id="copy" type="button">複製 C 參數</button><button id="share" type="button">複製目前參數連結</button></div></section>
<section class="card"><h2>公式與適用條件</h2><div class="formula" id="formula"></div></section>
</section>
</div>
</main>
<script src="../assets/learning/engineering-models.js"></script>
<script>
(function(){
  "use strict";
  const $=id=>document.getElementById(id),ids=["vref","bits","current","shunt","gain","offset","bus","rtop","rbot","seriesCount"];
  const n=id=>Number($(id).value);
  const fmt=(v,d=4)=>Number.isFinite(v)?Number(v).toFixed(d):"—";
  const metric=(label,value,note="")=>`<article class="metric"><span>${label}</span><strong>${value}</strong>${note?`<small>${note}</small>`:""}</article>`;
  const alert=(text,kind)=>`<div class="alert ${kind}">${text}</div>`;
  function pct(v,max){return max>0?CircuitModels.clamp(v/max*100,0,100):0;}
  function update(){
    try{
      const vref=n("vref"),bits=n("bits");
      const q=CircuitModels.quantizeAdc({voltageV:0,vrefV:vref,bits});
      $("adcResults").innerHTML=metric("Code 數",String(q.levels),"2^N")+metric("最大 code",String(q.maxCount),"2^N − 1")+metric("理想 LSB",fmt(q.lsbV*1000,4)+" mV","Vref / 2^N")+metric("端點顯示步距",fmt(vref/q.maxCount*1000,4)+" mV","只用於 0…maxCount 端點對映");

      const c=CircuitModels.calculateCurrentChain({currentA:n("current"),shuntOhm:n("shunt"),gain:n("gain"),offsetV:n("offset"),vrefV:vref,bits});
      $("currentResults").innerHTML=metric("Shunt 電壓",fmt(c.shuntV*1000,3)+" mV")+metric("ADC 輸入",fmt(c.adcInputV,4)+" V")+metric("ADC code",String(c.adc.count),c.adc.saturated?"已飽和":"未飽和")+metric("A / count",fmt(c.ampsPerCount,7)+" A")+metric("可量正電流",fmt(c.maxCurrentA,2)+" A")+metric("可量負電流",fmt(c.minCurrentA,2)+" A");
      $("currentFill").style.width=pct(c.adcInputV,vref)+"%";$("currentMark").style.left=pct(c.adcInputV,vref)+"%";$("currentZero").style.left=pct(c.offsetV,vref)+"%";
      let cw="";if(c.adc.saturatedHigh)cw+=alert("ADC 輸入高於或等於 Vref，code 已飽和。","bad");if(c.adc.saturatedLow)cw+=alert("ADC 輸入低於 0 V，負方向訊號已截斷。","bad");if(!c.adc.saturated)cw+=alert("目前電流訊號位於 ADC 可量範圍內。","good");$("currentWarns").innerHTML=cw;

      const d=CircuitModels.calculateDivider({busV:n("bus"),topOhm:n("rtop")*1000,bottomOhm:n("rbot")*1000,vrefV:vref,bits});
      const count=Math.max(1,Math.trunc(n("seriesCount"))),perResV=d.topVoltageV/count,perResW=d.topPowerW/count;
      $("dividerResults").innerHTML=metric("分壓比例",fmt(d.ratio,8))+metric("ADC 輸入",fmt(d.adcInputV,4)+" V")+metric("分壓電流",fmt(d.currentA*1e6,3)+" µA")+metric("Rtop 總功耗",fmt(d.topPowerW*1000,3)+" mW")+metric("Rbot 功耗",fmt(d.bottomPowerW*1000,3)+" mW")+metric("每顆 Rtop",fmt(perResV,2)+" V / "+fmt(perResW*1000,3)+" mW","仍須對照工作電壓與 surge rating")+metric("理想最大母線",fmt(d.maxBusV,2)+" V","尚未保留 transient 裕度")+metric("V / count",fmt(d.voltsPerCount,5)+" V");
      $("voltageFill").style.width=pct(d.adcInputV,vref)+"%";$("voltageMark").style.left=pct(d.adcInputV,vref)+"%";
      let dw="";if(d.adc.saturated)dw+=alert("分壓後超出 ADC 範圍，必須提高分壓比或降低最大母線規格。","bad");if(d.maxBusV<n("bus")*1.2)dw+=alert("最大母線餘裕低於 20%，未涵蓋 transient、容差與校準誤差。","warn");if(perResV>150)dw+=alert("每顆高側電阻承受電壓偏高，請檢查元件 working voltage，而不只看瓦數。","warn");if(!dw)dw=alert("目前分壓與 ADC 範圍有基本裕度；仍須驗證容差、取樣窗與過壓保護。","good");$("dividerWarns").innerHTML=dw;

      $("code").textContent=`#define ADC_LEVELS             (${q.levels}.0f)\n#define ADC_MAX_COUNT          (${q.maxCount}.0f)\n#define ADC_REF_VOLTAGE_V      (${fmt(vref,6)}f)\n#define ADC_VOLT_PER_COUNT_V   (${fmt(q.lsbV,9)}f)\n\n#define CURRENT_A_PER_COUNT    (${fmt(c.ampsPerCount,9)}f)\n#define CURRENT_ZERO_COUNT     (${c.zeroCount}.0f)\n#define BUS_V_PER_COUNT        (${fmt(d.voltsPerCount,9)}f)\n\n// amps = (adc_count - CURRENT_ZERO_COUNT) * CURRENT_A_PER_COUNT\n// bus_v = adc_count * BUS_V_PER_COUNT`;
      $("formula").textContent=`ADC: levels = 2^N, LSB = Vref / levels, code = floor(Vin / LSB)\nCurrent: Vadc = I × Rshunt × Gain + Offset\nDivider current: Idiv = Vbus / (Rtop + Rbot)\nRtop power: Ptop = Idiv² × Rtop = Vbus² × Rtop / (Rtop + Rbot)²\n\n注意：實際 C2000 ADC 還需檢查 source impedance、ACQPS、reference settling、INL/DNL、offset/gain error 與校準資料。`;
    }catch(error){$("currentWarns").innerHTML=alert(error.message,"bad");}
  }
  ids.forEach(id=>{$(id).addEventListener("input",update);$(id).addEventListener("change",update);});
  const query=new URLSearchParams(location.search);ids.forEach(id=>{if(query.has(id))$(id).value=query.get(id);});
  $("copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText($("code").textContent);$("copy").textContent="已複製";}catch(e){prompt("複製程式碼",$("code").textContent);}});
  $("share").addEventListener("click",async()=>{const q=new URLSearchParams();ids.forEach(id=>q.set(id,$(id).value));const url=location.origin+location.pathname+"?"+q;try{await navigator.clipboard.writeText(url);$("share").textContent="連結已複製";}catch(e){prompt("複製連結",url);}});
  update();
})();
</script>
<script data-circuit-tutor-js>window.CIRCUIT_ROOT_PREFIX="../";</script>
<script src="../assets/learning/curriculum.js" data-circuit-tutor-js></script>
<script src="../assets/learning/tutor.js" data-circuit-tutor-js></script>
</body>
</html>
