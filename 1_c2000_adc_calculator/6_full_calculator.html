<script>
(function(){
  const frame=document.getElementById("calculatorFrame");
  function resize(){
    try{
      const doc=frame.contentDocument;
      if(!doc)return;
      const height=Math.max(doc.documentElement.scrollHeight,doc.body?doc.body.scrollHeight:0);
      if(height)frame.style.height=(height+24)+"px";
      if(window.ResizeObserver&&doc.body){new ResizeObserver(resize).observe(doc.body);}
    }catch(error){frame.style.height="1200px";}
  }
  frame.addEventListener("load",resize);
})();
</script>
