<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全域搜尋 · 電路模擬說明</title>
<link rel="stylesheet" href="assets/learning/learning.css">
</head>
<body>
<main class="shell" id="app"></main>
<script src="assets/learning/curriculum.js"></script>
<script src="assets/learning/learning.js"></script>
<script>
(function(){
  function esc(v){return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  const rows = [];
  [
    ["學習工具", "Guide", "初學者拆解路線", "每個主題用一句話、比喻、最小操作與判讀拆開。", "beginner.html"],
    ["學習工具", "Labs", "實用實驗任務", "用工程任務驅動操作，包含成功條件與實務用途。", "labs.html"],
    ["學習工具", "Debug", "故障速查表", "從症狀反查原因、確認方式與修法。", "troubleshooting.html"],
    ["學習工具", "Progress", "學習進度總表", "查看課程、實驗、測驗完成狀態與下一步建議。", "progress.html"],
    ["學習工具", "Quiz", "判斷測驗", "確認能把現象、原因、操作與成功條件對起來。", "quiz.html"],
    ["學習工具", "Glossary", "全域詞彙表", "集中解釋跨主題關鍵字。", "glossary.html"],
    ["學習工具", "Report", "實驗報告產生器", "把任務、參數、觀察與工程結論整理成 Markdown。", "report.html"]
  ].forEach(r => rows.push({type:r[0], tag:r[1], title:r[2], body:r[3], href:r[4]}));
  CircuitCurriculum.modules.forEach(m => {
    rows.push({type:"主題", tag:m.tag, title:m.title, body:m.oneLine + " " + m.whyUseful, href:m.entry});
    const base = m.entry.replace(/[^/]+$/, "");
    m.lessons.forEach(l => rows.push({type:"課程", tag:m.tag, title:l[1], body:l.slice(2).join(" "), href:base + l[0]}));
    m.labs.forEach(l => rows.push({type:"實驗", tag:m.tag, title:l[1], body:l.slice(3).join(" "), href:l[2]}));
    m.faults.forEach(f => rows.push({type:"故障", tag:m.tag, title:f[0], body:f.slice(1,4).join(" "), href:f[4]}));
  });
  (CircuitCurriculum.glossary || []).forEach(g => rows.push({type:"詞彙", tag:"Glossary", title:g[0], body:g[1] + " " + g[2], href:"glossary.html"}));
  const app = document.getElementById("app");
  app.innerHTML = CircuitLearning.nav("search")
    + '<section class="hero"><div class="eyebrow">Search</div><h1>全域搜尋</h1><p class="lead">搜尋課程、實驗任務、故障症狀、詞彙與實務提示。</p></section>'
    + '<section class="toolbar"><input class="search" id="q" autofocus placeholder="例如 overrun、Offset、死區、漣波、UDS"><span class="muted" id="count"></span></section>'
    + '<section class="lab-grid" id="results"></section>';
  const q = document.getElementById("q");
  const results = document.getElementById("results");
  const count = document.getElementById("count");
  function render(){
    const term = q.value.trim().toLowerCase();
    const out = rows.filter(r => !term || (r.title + " " + r.body + " " + r.tag + " " + r.type).toLowerCase().includes(term));
    count.textContent = out.length + " / " + rows.length + " 筆";
    results.innerHTML = out.slice(0, 80).map(r => '<a class="lab" href="' + r.href + '"><span class="tag">' + esc(r.type) + " · " + esc(r.tag) + '</span><h3>' + esc(r.title) + '</h3><p>' + esc(r.body) + '</p></a>').join("") || '<div class="empty">找不到符合的內容。</div>';
  }
  q.addEventListener("input", render);
  render();
})();
</script>
</body>
</html>
