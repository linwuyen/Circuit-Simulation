<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2 · Buck 電流漣波與 CCM/DCM 邊界</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#1e293b;--muted:#64748b;--line:#dbe3ee;--blue:#2563eb;--green:#047857;--amber:#a16207;--red:#b91c1c;--mono:ui-monospace,Consolas,monospace}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.65}.wrap{max-width:980px;margin:auto;padding:22px 18px 64px}a{color:var(--blue);text-decoration:none}h1{margin:6px 0;font-size:25px}.sub{margin:0 0 18px;color:var(--muted)}.grid{display:grid;grid-template-columns:340px 1fr;gap:18px}.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:17px}.control{margin-top:15px}.row{display:flex;justify-content:space-between;gap:10px}.value{font-family:var(--mono);font-weight:800}input[type=range]{width:100%}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}.metric{padding:12px;border:1px solid var(--line);border-radius:10px;background:#f8fafc}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;margin-top:4px;font:800 20px var(--mono)}.scope{background:#0f172a;border-radius:12px;padding:12px}.scope svg{display:block;width:100%;height:auto}.status{margin-top:12px;padding:12px 14px;border-radius:10px;font-weight:700}.good{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}.warn{background:#fffbeb;color:#854d0e;border:1px solid #fde68a}.bad{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}.formula,.note{margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff}.formula{font-family:var(--mono);font-size:13px}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:24px}.nav a{padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:#fff}@media(max-width:760px){.grid{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}}@media(max-width:460px){.metrics{grid-template-columns:1fr}}
</style>
<link rel="stylesheet" href="../assets/learning/tutor.css" data-circuit-tutor-css>
</head>
<body>
<main class="wrap">
<div><a href="index.html">← Buck 學習地圖</a></div>
<h1>電流漣波 ΔI 與 CCM/DCM 邊界</h1>
<p class="sub">L 或開關頻率提高會降低 CCM 電流漣波；當計算出的谷值碰到 0，必須停止套用對稱三角波假設。</p>
<div class="grid">
<section class="panel">
<div class="control"><div class="row"><label for="ind">電感 L</label><output class="value" id="indOut"></output></div><input id="ind" type="range" min="0.5" max="20" step="0.1" value="2.2"></div>
<div class="control"><div class="row"><label for="fsw">開關頻率</label><output class="value" id="fswOut"></output></div><input id="fsw" type="range" min="100" max="2000" step="50" value="500"></div>
<div class="control"><div class="row"><label for="load">輸出電流</label><output class="value" id="loadOut"></output></div><input id="load" type="range" min="0" max="5" step="0.05" value="2"></div>
<div class="note"><b>固定條件：</b>Vin = 12 V、Vout = 3.3 V。頁面先用 CCM 設計公式檢查邊界；進入 DCM 後，實際 Vout、Duty 與負載的關係必須改用 DCM 模型求解。</div>
</section>
<section>
<div class="metrics">
<div class="metric"><span>CCM 漣波 ΔI</span><strong id="delta"></strong></div>
<div class="metric"><span>工作模式</span><strong id="mode"></strong></div>
<div class="metric"><span>峰值 / 谷值</span><strong id="peakValley"></strong></div>
<div class="metric"><span>CCM 邊界電流</span><strong id="boundary"></strong></div>
</div>
<div class="scope"><svg id="scope" viewBox="0 0 620 270" role="img" aria-labelledby="scopeTitle scopeDesc"><title id="scopeTitle">Buck 電感電流波形</title><desc id="scopeDesc">顯示兩個開關週期的電感電流，以及零電流邊界。</desc></svg></div>
<div id="status" class="status"></div>
<div id="formula" class="formula"></div>
</section>
</div>
<div class="nav"><a href="1_inductor_triangle.html">← 上一頁</a><a href="3_cap_voltage_ripple.html">下一頁：電壓漣波 →</a></div>
</main>
<script src="../assets/learning/engineering-models.js"></script>
<script>
(function(){
  "use strict";
  const $=id=>document.getElementById(id);
  const controls=["ind","fsw","load"];
  function draw(result){
    const svg=$("scope"),W=620,H=270,left=52,right=18,top=22,bottom=38,w=W-left-right,h=H-top-bottom;
    const max=Math.max(result.ccmPeakA,result.deltaIA,result.outputCurrentA,0.5)*1.2;
    const y=value=>top+h-(Math.max(0,value)/max)*h;
    let html=`<rect x="${left}" y="${top}" width="${w}" height="${h}" fill="#111c2d"/><line x1="${left}" y1="${y(0)}" x2="${W-right}" y2="${y(0)}" stroke="#f59e0b" stroke-dasharray="6 5"/><text x="8" y="${y(0)+4}" fill="#fbbf24" font-size="12">0 A</text>`;
    for(let i=1;i<6;i++){const yy=top+h*i/6;html+=`<line x1="${left}" y1="${yy}" x2="${W-right}" y2="${yy}" stroke="rgba(148,163,184,.15)"/>`;}
    const points=[];
    for(let period=0;period<2;period++){
      const x0=left+period*w/2,x1=x0+w/4,x2=x0+w/2;
      if(result.mode==="DCM"){
        const zeroX=x0+w*.39;
        points.push([x0,y(0)],[x1,y(result.deltaIA)],[zeroX,y(0)],[x2,y(0)]);
      }else{
        points.push([x0,y(result.valleyA)],[x1,y(result.peakA)],[x2,y(result.valleyA)]);
      }
    }
    html+=`<polyline points="${points.map(p=>p.join(",")).join(" ")}" fill="none" stroke="${result.mode==="DCM"?"#fb7185":"#60a5fa"}" stroke-width="4" stroke-linejoin="round"/>`;
    html+=`<line x1="${left}" y1="${y(result.outputCurrentA)}" x2="${W-right}" y2="${y(result.outputCurrentA)}" stroke="#34d399" stroke-dasharray="4 5"/><text x="${W-right-4}" y="${y(result.outputCurrentA)-7}" text-anchor="end" fill="#6ee7b7" font-size="12">Iout ${result.outputCurrentA.toFixed(2)} A</text>`;
    svg.innerHTML=html;
  }
  function update(){
    const L=Number($("ind").value),fsw=Number($("fsw").value),load=Number($("load").value);
    $("indOut").textContent=L.toFixed(1)+" µH";$("fswOut").textContent=fsw.toFixed(0)+" kHz";$("loadOut").textContent=load.toFixed(2)+" A";
    const r=CircuitModels.calculateBuckRipple({vin:12,vout:3.3,inductanceH:L*1e-6,switchingHz:fsw*1e3,outputCurrentA:load});
    $("delta").textContent=r.deltaIA.toFixed(3)+" A";$("mode").textContent=r.mode;$("peakValley").textContent=r.peakA.toFixed(2)+" / "+r.valleyA.toFixed(2)+" A";$("boundary").textContent=r.boundaryCurrentA.toFixed(3)+" A";
    const status=$("status");status.className="status "+(r.mode==="CCM"?"good":r.mode==="BOUNDARY"?"warn":"bad");status.textContent=r.mode==="CCM"?"CCM：谷值仍高於 0，對稱三角波與 Vout ≈ Vin × Duty 假設可用。":r.mode==="BOUNDARY"?"臨界導通：谷值剛好碰到 0。":"DCM：電流不得延伸成負值；原本 CCM 轉移關係已失效。";
    $("formula").innerHTML=`D = Vout / Vin = ${r.duty.toFixed(4)}<br>ΔI<sub>CCM</sub> = (Vin − Vout) × D / (f<sub>sw</sub> × L) = <b>${r.deltaIA.toFixed(4)} A</b><br>I<sub>boundary</sub> = ΔI / 2 = <b>${r.boundaryCurrentA.toFixed(4)} A</b>${r.warning?"<br><b>限制：</b>"+r.warning:""}`;
    draw(r);
  }
  controls.forEach(id=>$(id).addEventListener("input",update));update();
})();
</script>
<script data-circuit-tutor-js>window.CIRCUIT_ROOT_PREFIX="../";</script>

</body>
</html>
