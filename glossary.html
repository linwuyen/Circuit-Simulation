<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全域詞彙表 · 電路模擬說明</title>
<link rel="stylesheet" href="assets/learning/learning.css">
</head>
<body>
<main class="shell" id="app"></main>
<script src="assets/learning/curriculum.js"></script>
<script src="assets/learning/learning.js"></script>
<script>
(function(){
  const terms = CircuitCurriculum.glossary || [];
  const app = document.getElementById("app");
  app.innerHTML = CircuitLearning.nav("glossary")
    + '<section class="hero"><div class="eyebrow">Glossary</div><h1>全域詞彙表</h1><p class="lead">把各教材反覆出現的關鍵字集中解釋。搜尋關鍵字時會同時比對英文、中文說明與實務提示。</p></section>'
    + '<section class="toolbar"><input class="search" id="termSearch" placeholder="搜尋 ADC、PWM、Offset、死區、UDS..."><span class="muted">共 ' + terms.length + ' 個詞彙</span></section>'
    + '<section class="lab-grid" id="terms">' + terms.map(t => '<article class="lab"><span class="tag">' + t[0] + '</span><h3>' + t[0] + '</h3><p>' + t[1] + '</p><ul class="field-list"><li><b>實務提示</b><span>' + t[2] + '</span></li></ul></article>').join("") + '</section>';
  document.getElementById("termSearch").addEventListener("input", function(){
    const q = this.value.trim().toLowerCase();
    document.querySelectorAll("#terms .lab").forEach(card => {
      card.style.display = !q || card.textContent.toLowerCase().includes(q) ? "" : "none";
    });
  });
})();
</script>
</body>
</html>
